<!DOCTYPE html>

    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Abaton" />

    <title>Abaton Sacred Dreams</title>
    <style>html,body{background:#F2DFCF;margin:0}</style>
    <script>
      window.addEventListener('error',function(e){
        var t=e.target;
        if(t&&t.tagName==='SCRIPT'){
          var k='abaton_script_fail',n=+(sessionStorage.getItem(k)||0);
          if(n<3){sessionStorage.setItem(k,String(n+1));setTimeout(function(){location.reload()},3000);}
        }
      },true);
    </script>
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32.png" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
