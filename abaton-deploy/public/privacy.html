<p>La presente informativa è resa, ai sensi dell'art. 13 GDPR 679/2016 – “Regolamento europeo sulla protezione dei dati personali”, alle persone che prenotano una camera presso Abaton, concludendo una transazione con Ass. La Grande Opera impresa sociale, oppure con uno dei soggetti che hanno designato Ass. La Grande Opera impresa sociale quale responsabile del trattamento (art. 28 GDPR).</p>
<h2>Identità del Titolare del trattamento</h2>
<p>Il Titolare del trattamento è ${ORG}, con sede legale in Via Baldissero, 21, Vidracco (TO), in persona del Presidente pro tempore.</p>
<p>${ORG} è stata inoltre designata responsabile del trattamento, ai sensi dell'art. 28 GDPR, dai seguenti titolari autonomi o contitolari del trattamento elencati all'indirizzo <a href="http://www.damanhur.org/it/privacy" target="_blank" rel="noopener">www.damanhur.org/it/privacy</a>. Il trattamento per il quale ${ORG} è stata designata responsabile è la gestione dei dati di contatto delle persone per garantire la fruizione in sicurezza delle loro attività.</p>
<p>Il riscontro agli interessati che esercitano i propri diritti spetta al Titolare o ai Contitolari del trattamento dei dati personali.</p>
<p>${ORG} garantisce la sicurezza, la riservatezza e la protezione dei dati personali in suo possesso, in ogni fase del trattamento.</p>

<p>È stato nominato un Responsabile della Protezione dei Dati (DPO), domiciliato per la funzione presso la sede legale di ${ORG} in Via Baldissero, 21, Vidracco (TO), contattabile via e-mail all'indirizzo <a href="mailto:direttivo@grandeopera.org">direttivo@grandeopera.org</a></p>
<h2>Fonte dei dati</h2>
<p>I dati personali trattati sono quelli forniti dall'interessato in occasione di:</p>

<h2>Finalità del trattamento</h2>
<p>I dati personali sono trattati per lo svolgimento delle necessarie attività precontrattuali, per la definizione e l'accettazione del contratto di servizio che regola la prestazione e per il corretto svolgimento di tutte le attività connesse.</p>

<h2>Base giuridica del trattamento</h2>
<p>I dati raccolti per le finalità sopra indicate sono trattati lecitamente in quanto necessari per:</p>

<p>I soggetti esterni a cui il Titolare ha affidato il trattamento dei dati personali sono stati designati responsabili del trattamento.</p>
<h2>Trasferimento dei dati</h2>
<p>Qualora il Titolare trasferisca dati personali verso paesi terzi od organizzazioni internazionali, nell'ambito delle finalità sopra indicate, lei sarà informato circa l'esistenza o meno di una decisione di adeguatezza della Commissione europea.</p>

<h2>Conservazione dei dati</h2>
<p>Il Titolare conserva e tratta i dati personali per il tempo necessario ad adempiere alle finalità indicate. In particolare, i dati dei clienti sono conservati fino al termine di prescrizione amministrativa applicabile.</p>
<h2>Diritti dell'interessato</h2>
<p>Con riferimento agli artt. 15 – diritto di accesso, 16 – diritto di rettifica, 17 – diritto alla cancellazione, 18 – diritto di limitazione del trattamento, 20 – diritto alla portabilità dei dati, 21 – diritto di opposizione, 22 – diritto di opposizione al processo decisionale automatizzato del GDPR, l'interessato può esercitare i propri diritti scrivendo a <a href="mailto:direttivo@grandeopera.org">direttivo@grandeopera.org</a> oppure al Titolare all'indirizzo sopra indicato, specificando l'oggetto della richiesta, il diritto che intende esercitare e allegando copia di un documento d'identità che attesti la legittimità della richiesta.</p>
<p>Il Titolare ricorda in particolare che ogni interessato può esercitare il diritto di opposizione nei modi e nelle forme previsti dall'art. 21 GDPR.</p>

<h2>Processi decisionali automatizzati</h2>
<p>Qualora si renda necessario un trattamento che comporti processi decisionali automatizzati sui dati di persone fisiche, sarà richiesto il consenso esplicito e debitamente specificato dell'interessato.</p>

<p>In particular, they are processed for the following purposes:</p>
<ol>
<li>to acquire, confirm, cancel and manage bookings for accommodation services and ancillary services, and to provide the requested services;</li>
<li>performance of activities related and instrumental to the management of the contractual relationship (provision of services, reporting on the provision);</li>
<li>communication of personal data relating to the stay in order to comply with applicable legal obligations regarding public security, and administrative, accounting and fiscal obligations;</li>
<li>registration of access to the facility;</li>
<li>acquisition, recording and consultation of the data subject's personal data for the purpose of protecting persons, property and company assets through a <u>possible</u> video surveillance system (if and where present);</li>
<li>Sending commercial communications and informational materials on offers and rates relating to services already provided to you (soft spam);</li>
<li>Sending commercial communications and informational materials on offers and rates relating to new services or third-party promotions (direct marketing);</li>
<li>improvement and personalisation of the service with reference to stay preferences and habits, which may relate to special categories of personal data (pursuant to Art. 9 GDPR, so-called “sensitive data”, such as <em>requests related to disabilities, food allergies, etc</em>). Please be informed that such data will be processed by authorised personnel with the utmost confidentiality and will not be disclosed to unauthorised third parties.</li>
</ol>
<h2>Legal Basis for Processing</h2>
<p>The data collected for the purposes indicated above are lawfully processed as necessary for:</p>
<ul>
<li>the performance of a contract to which the data subject is party, or in order to take steps at the data subject's request prior to entering into a contract (purposes referred to in points 1 and 2);</li>
<li>compliance with a legal obligation to which the Controller is subject (purpose referred to in point 3);</li>
<li>the pursuit of a legitimate interest of the Controller: safeguarding the security of persons and company assets (purposes 4 and 5). Soft spam Art. 6(1)(f) GDPR, to enable us to offer you a better service consistent with your purchases. Prior consent is not required in this case, but you may object to these communications at any time (by clicking “unsubscribe” at the bottom of emails or by writing to us) free of charge and immediately (purpose 6);</li>
<li>the purposes referred to in points 7 and 8, with the explicit consent of the data subject given by signature.</li>
</ul>
<h2>Recipients of Data</h2>
<p>The personal data processed by ${ORG} are not disclosed, meaning they are not made available to unspecified parties in any form, including by making them accessible or available for consultation. They may, however, be communicated to workers employed by, or volunteers or collaborators of the Controller, and to external parties collaborating with the Controller who have been designated as data processors or authorised to process data as they operate under the Controller's authority.</p>
<p>In particular, based on the roles and duties performed, workers have been authorised to process your personal data within the limits of their responsibilities and in accordance with the instructions given to them by the Controller.</p>
<p>They may also be communicated, to the extent strictly necessary, to parties who, for the purpose of fulfilling your requests, must supply goods or perform services on behalf of the Controller. Finally, they may be communicated to parties entitled to access them by virtue of laws, regulations, or EU legislation.</p>
<p>External parties operating under the authority of the Controller have also been duly authorised based on the type of service provided, the processing performed, and the nature of the data processed.</p>
<p>External parties to whom the Controller has entrusted the processing of personal data have been designated as data processors.</p>
<h2>Data Transfers</h2>
<p>Should the Controller transfer personal data to third countries or international organisations, within the scope of the purposes indicated above, you will be informed as to whether or not an adequacy decision by the EU Commission exists.</p>
<p>The Controller also reserves the right to use cloud services; in such case, service providers will be selected from among those who provide adequate guarantees, as required by Art. 46 GDPR 2016/679.</p>
<h2>Data Retention</h2>
<p>The Controller retains and processes personal data for the time necessary to fulfil the indicated purposes. Specifically, client data is retained until the applicable administrative limitation period.</p>
<h2>Rights of the Data Subject</h2>
<p>With reference to Arts. 15 – right of access, 16 – right to rectification, 17 – right to erasure, 18 – right to restriction of processing, 20 – right to data portability, 21 – right to object, 22 – right to object to automated decision-making under the GDPR, the data subject may exercise their rights by writing to <a href="mailto:direttivo@grandeopera.org">direttivo@grandeopera.org</a> or to the Controller at the address indicated above, specifying the subject of the request, the right they intend to exercise, and enclosing a copy of an identity document attesting to the legitimacy of the request.</p>
<p>The Controller recalls in particular that every data subject may exercise the right to object in the manner and forms provided for by Art. 21 GDPR.</p>
<h2>Withdrawal of Consent</h2>
<p>With reference to Art. 7 of the GDPR, the data subject may withdraw any consent given at any time. However, processing that does not require consent to be lawful may be carried out even in the absence of consent, for example for the performance of a contract to which the data subject is party (the supply relationship for products and/or services) and on the other legal bases indicated above.</p>
<h2>Refusal to Provide Data</h2>
<p>The data subject may not refuse to provide the Controller with the personal data necessary for civil, accounting and fiscal obligations connected with the supply or provision of services.</p>
<p>The provision of additional personal data, although optional, is necessary for the correct and efficient management of the contractual relationship. Therefore, any refusal to provide such data may wholly or partially compromise the contractual relationship itself.</p>
<h2>Automated Decision-Making Processes</h2>
<p>Should processing involving automated decision-making on the data of natural persons arise, the data subject's explicit and duly specified consent will be requested.</p>
`},

html:`
<p>Diese Hinweise werden gemäß Art. 13 DSGVO 679/2016 – „Europäische Datenschutz-Grundverordnung“ – den Personen erteilt, die ein Zimmer bei Abaton buchen, indem sie ein Rechtsgeschäft mit Ass. La Grande Opera impresa sociale abschließen oder mit einer der Stellen, die Ass. La Grande Opera impresa sociale als Auftragsverarbeiter benannt haben (Art. 28 DSGVO).</p>
<h2>Identität des Verantwortlichen</h2>
<p>Verantwortlicher für die Verarbeitung ist die ${ORG} mit Rechtssitz in Via Baldissero, 21, Vidracco (TO), vertreten durch den amtierenden Präsidenten.</p>
<p>Die ${ORG} wurde außerdem gemäß Art. 28 DSGVO von den unter <a href="http://www.damanhur.org/it/privacy" target="_blank" rel="noopener">www.damanhur.org/it/privacy</a> aufgeführten eigenständigen bzw. gemeinsam Verantwortlichen als Auftragsverarbeiter benannt. Die Verarbeitung, für die die ${ORG} als Auftragsverarbeiter benannt wurde, ist die Verwaltung der Kontaktdaten von Personen, um die sichere Teilnahme an ihren Aktivitäten zu gewährleisten.</p>
<p>Die Beantwortung von Anfragen betroffener Personen, die ihre Rechte ausüben, obliegt dem Verantwortlichen bzw. den gemeinsam Verantwortlichen für die Verarbeitung der personenbezogenen Daten.</p>
<p>Die ${ORG} gewährleistet die Sicherheit, Vertraulichkeit und den Schutz der in ihrem Besitz befindlichen personenbezogenen Daten in jeder Phase der Verarbeitung.</p>
<h2>Identität des Datenschutzbeauftragten</h2>
<p>Es wurde ein Datenschutzbeauftragter (DSB) benannt, der für diese Funktion am Rechtssitz der ${ORG} in Via Baldissero, 21, Vidracco (TO) ansässig und per E-Mail unter <a href="mailto:direttivo@grandeopera.org">direttivo@grandeopera.org</a> erreichbar ist.</p>
<h2>Herkunft der Daten</h2>
<p>Die verarbeiteten personenbezogenen Daten sind diejenigen, die von der betroffenen Person bereitgestellt werden anlässlich von:</p>
<ul><li>Aufenthalten oder Telefonaten;</li><li>direkten Kontakten;</li><li>Websites, sozialen Netzwerken, E-Mail;</li><li>der Erstellung von Angeboten und Kostenvoranschlägen;</li><li>Übermittlungen und Transaktionen im Anschluss an eine Bestellung;</li><li>freiwillig abgegebenen Bewertungen, in Papierform oder online.</li></ul>
<h2>Zwecke der Verarbeitung</h2>
<p>Die personenbezogenen Daten werden zur Durchführung der erforderlichen vorvertraglichen Tätigkeiten, zur Festlegung und Annahme des Dienstleistungsvertrags, der die Leistung regelt, sowie zur ordnungsgemäßen Durchführung aller damit verbundenen Tätigkeiten verarbeitet.</p>
<p>Insbesondere werden sie zu folgenden Zwecken verarbeitet:</p>
<ol>
<li>Buchungen von Unterkunfts- und Zusatzleistungen entgegenzunehmen, zu bestätigen, zu stornieren und zu verwalten sowie die angeforderten Leistungen zu erbringen;</li>
<li>Durchführung der mit der Verwaltung des Vertragsverhältnisses verbundenen und dafür erforderlichen Tätigkeiten (Erbringung der Leistungen, Abrechnung der Leistung);</li>
<li>Übermittlung der personenbezogenen Daten zum Aufenthalt zur Erfüllung der gesetzlichen Pflichten im Bereich der öffentlichen Sicherheit sowie der verwaltungs-, buchhaltungs- und steuerrechtlichen Pflichten;</li>
<li>Erfassung der Zutritte zur Unterkunft;</li>
<li>Erhebung, Aufzeichnung und Einsichtnahme personenbezogener Daten der betroffenen Person zum Schutz von Personen, Sachen und Betriebsvermögen mittels einer <u>etwaigen</u> Videoüberwachungsanlage (falls und wo vorhanden);</li>
<li>Zusendung von Werbemitteilungen und Informationsmaterial über Angebote und Preise zu Leistungen, die Sie bereits in Anspruch genommen haben (Soft Spam);</li>
<li>Zusendung von Werbemitteilungen und Informationsmaterial über Angebote und Preise zu neuen Leistungen oder Werbeaktionen Dritter (Direktmarketing);</li>
<li>Verbesserung und Personalisierung der Leistung in Bezug auf Vorlieben und Gewohnheiten beim Aufenthalt, die besondere Kategorien personenbezogener Daten betreffen können (gemäß Art. 9 DSGVO, sog. „sensible Daten“, wie z. B. <em>Anliegen im Zusammenhang mit Behinderungen, Lebensmittelallergien usw.</em>). Wir weisen darauf hin, dass diese Daten von befugtem Personal mit größter Vertraulichkeit verarbeitet und nicht an unbefugte Dritte weitergegeben werden.</li>
</ol>
<h2>Rechtsgrundlage der Verarbeitung</h2>
<p>Die zu den oben genannten Zwecken erhobenen Daten werden rechtmäßig verarbeitet, da sie erforderlich sind für:</p>
<ul>
<li>die Erfüllung eines Vertrags, dessen Vertragspartei die betroffene Person ist, oder die Durchführung vorvertraglicher Maßnahmen, die auf ihre Anfrage erfolgen (Zwecke gemäß Punkt 1 und 2);</li>
<li>die Erfüllung einer rechtlichen Verpflichtung, der der Verantwortliche unterliegt (Zweck gemäß Punkt 3);</li>
<li>die Wahrung eines berechtigten Interesses des Verantwortlichen: Schutz der Sicherheit von Personen und des Betriebsvermögens (Zwecke 4 und 5). Soft Spam gemäß Art. 6 Abs. 1 lit. f DSGVO, um Ihnen einen besseren und auf Ihre Käufe abgestimmten Service anbieten zu können. In diesem Fall ist keine vorherige Einwilligung erforderlich, Sie können diesen Mitteilungen jedoch jederzeit kostenlos und mit sofortiger Wirkung widersprechen (durch Klicken auf „Abmelden“ am Ende der E-Mails oder indem Sie uns schreiben) (Zweck 6);</li>
<li>die Zwecke gemäß Punkt 7 und 8 mit der ausdrücklichen, durch Unterschrift erteilten Einwilligung der betroffenen Person.</li>
</ul>
<h2>Empfänger der Daten</h2>
<p>Die von der ${ORG} verarbeiteten personenbezogenen Daten werden nicht verbreitet, d. h. sie werden unbestimmten Personen in keiner Form zugänglich gemacht, auch nicht durch Bereitstellung oder Einsichtnahme. Sie können jedoch an Arbeitnehmer, Ehrenamtliche oder Mitarbeiter des Verantwortlichen sowie an externe Stellen weitergegeben werden, die mit dem Verantwortlichen zusammenarbeiten und als Auftragsverarbeiter benannt oder zur Verarbeitung befugt sind, da sie unter der Aufsicht des Verantwortlichen tätig sind.</p>
<p>Insbesondere wurden die Mitarbeiter entsprechend ihren Rollen und Aufgaben befugt, Ihre personenbezogenen Daten im Rahmen ihrer jeweiligen Zuständigkeiten und gemäß den Anweisungen des Verantwortlichen zu verarbeiten.</p>
<p>Sie können außerdem, soweit unbedingt erforderlich, an Stellen weitergegeben werden, die zur Erfüllung Ihrer Anfragen Waren liefern oder Leistungen im Auftrag des Verantwortlichen erbringen müssen. Schließlich können sie an Stellen weitergegeben werden, die aufgrund von Gesetzen, Verordnungen oder Rechtsvorschriften der Europäischen Union zum Zugriff berechtigt sind.</p>
<p>Auch die externen Stellen, die unter der Aufsicht des Verantwortlichen tätig sind, wurden entsprechend der Art der erbrachten Leistung, der durchgeführten Verarbeitung und der Art der verarbeiteten Daten ordnungsgemäß befugt.</p>
<p>Die externen Stellen, denen der Verantwortliche die Verarbeitung personenbezogener Daten übertragen hat, wurden als Auftragsverarbeiter benannt.</p>
<h2>Übermittlung der Daten</h2>
<p>Sollte der Verantwortliche im Rahmen der oben genannten Zwecke personenbezogene Daten an Drittländer oder internationale Organisationen übermitteln, werden Sie darüber informiert, ob ein Angemessenheitsbeschluss der Europäischen Kommission vorliegt oder nicht.</p>
<p>Der Verantwortliche behält sich zudem vor, Cloud-Dienste zu nutzen; in diesem Fall werden die Dienstanbieter unter denjenigen ausgewählt, die geeignete Garantien gemäß Art. 46 DSGVO 2016/679 bieten.</p>
<h2>Speicherdauer</h2>
<p>Der Verantwortliche speichert und verarbeitet die personenbezogenen Daten so lange, wie es zur Erfüllung der genannten Zwecke erforderlich ist. Insbesondere werden die Daten der Kunden bis zum Ablauf der geltenden verwaltungsrechtlichen Verjährungsfrist aufbewahrt.</p>
<h2>Rechte der betroffenen Person</h2>
<p>In Bezug auf die Art. 15 – Auskunftsrecht, 16 – Recht auf Berichtigung, 17 – Recht auf Löschung, 18 – Recht auf Einschränkung der Verarbeitung, 20 – Recht auf Datenübertragbarkeit, 21 – Widerspruchsrecht, 22 – Recht auf Widerspruch gegen automatisierte Entscheidungsfindung der DSGVO kann die betroffene Person ihre Rechte ausüben, indem sie an <a href="mailto:direttivo@grandeopera.org">direttivo@grandeopera.org</a> oder an den Verantwortlichen unter der oben angegebenen Adresse schreibt und dabei den Gegenstand der Anfrage und das Recht, das sie ausüben möchte, angibt und eine Kopie eines Ausweisdokuments beifügt, das die Rechtmäßigkeit der Anfrage belegt.</p>
<p>Der Verantwortliche weist insbesondere darauf hin, dass jede betroffene Person das Widerspruchsrecht in der in Art. 21 DSGVO vorgesehenen Art und Weise ausüben kann.</p>
<h2>Widerruf der Einwilligung</h2>
<p>Gemäß Art. 7 DSGVO kann die betroffene Person eine erteilte Einwilligung jederzeit widerrufen. Verarbeitungen, die für ihre Rechtmäßigkeit keine Einwilligung erfordern, können jedoch auch ohne Einwilligung durchgeführt werden, beispielsweise zur Erfüllung eines Vertrags, dessen Vertragspartei die betroffene Person ist (Liefer- bzw. Leistungsverhältnis über Produkte und/oder Dienstleistungen), sowie auf Grundlage der übrigen oben genannten Rechtsgrundlagen.</p>
<h2>Verweigerung der Bereitstellung der Daten</h2>
<p>Die betroffene Person kann sich nicht weigern, dem Verantwortlichen die personenbezogenen Daten bereitzustellen, die für die zivilrechtlichen, buchhalterischen und steuerlichen Pflichten im Zusammenhang mit der Lieferung oder Erbringung der Leistungen erforderlich sind.</p>
<p>Die Bereitstellung weiterer personenbezogener Daten ist zwar freiwillig, aber für eine korrekte und effiziente Abwicklung des Vertragsverhältnisses erforderlich. Eine etwaige Weigerung, diese Daten bereitzustellen, kann daher das Vertragsverhältnis ganz oder teilweise beeinträchtigen.</p>
<h2>Automatisierte Entscheidungsprozesse</h2>
<p>Sollte eine Verarbeitung erforderlich werden, die automatisierte Entscheidungsprozesse in Bezug auf Daten natürlicher Personen umfasst, wird die ausdrückliche und ordnungsgemäß spezifizierte Einwilligung der betroffenen Person eingeholt.</p>
`},

p8:"La personne concernée, en ce qui concerne le traitement de données appartenant à des catégories particulières au sens de l'art. 9 du RGPD 679/2016 (données sensibles) pour la fourniture des services demandés par les clients, comme celles relatives à un handicap ou à des allergies alimentaires (point 8 des finalités du traitement)",

html:`
<p>La présente note d'information est fournie, conformément à l'art. 13 du RGPD 679/2016 – « Règlement européen relatif à la protection des données personnelles », aux personnes qui réservent une chambre à Abaton, en concluant une transaction avec Ass. La Grande Opera impresa sociale, ou avec l'une des entités ayant désigné Ass. La Grande Opera impresa sociale comme sous-traitant (art. 28 RGPD).</p>
<h2>Identité du responsable du traitement</h2>
<p>Le responsable du traitement est l'${ORG}, dont le siège social est situé Via Baldissero, 21, Vidracco (TO), représentée par son Président en exercice.</p>
<p>L'${ORG} a en outre été désignée comme sous-traitant, conformément à l'art. 28 RGPD, par les responsables du traitement autonomes ou conjoints énumérés à l'adresse <a href="http://www.damanhur.org/it/privacy" target="_blank" rel="noopener">www.damanhur.org/it/privacy</a>. Le traitement pour lequel l'${ORG} a été désignée sous-traitant est la gestion des coordonnées des personnes afin de garantir le déroulement en toute sécurité de leurs activités.</p>
<p>La réponse aux personnes concernées qui exercent leurs droits incombe au responsable du traitement ou aux responsables conjoints du traitement des données personnelles.</p>
<p>L'${ORG} garantit la sécurité, la confidentialité et la protection des données personnelles en sa possession, à chaque étape du traitement.</p>
<h2>Identité du délégué à la protection des données</h2>
<p>Un délégué à la protection des données (DPO) a été désigné ; il est domicilié, pour l'exercice de cette fonction, au siège social de l'${ORG}, Via Baldissero, 21, Vidracco (TO), et peut être contacté par e-mail à l'adresse <a href="mailto:direttivo@grandeopera.org">direttivo@grandeopera.org</a></p>
<h2>Source des données</h2>
<p>Les données personnelles traitées sont celles fournies par la personne concernée à l'occasion de :</p>
<ul><li>séjours ou appels téléphoniques ;</li><li>contacts directs ;</li><li>sites web, réseaux sociaux, e-mails ;</li><li>l'élaboration de propositions et de devis ;</li><li>transmissions et transactions faisant suite à une commande ;</li><li>avis laissés volontairement, sur papier ou en ligne.</li></ul>
<h2>Finalités du traitement</h2>
<p>Les données personnelles sont traitées pour l'exécution des activités précontractuelles nécessaires, pour la définition et l'acceptation du contrat de service qui régit la prestation et pour le bon déroulement de toutes les activités connexes.</p>
<p>En particulier, elles sont traitées aux fins suivantes :</p>
<ol>
<li>recueillir, confirmer, annuler et gérer les réservations des services d'hébergement et des services annexes, et fournir les services demandés ;</li>
<li>exercice des activités liées et nécessaires à la gestion de la relation contractuelle (fourniture des services, compte rendu de la prestation) ;</li>
<li>communication des données personnelles relatives au séjour afin de satisfaire aux obligations légales en matière de sécurité publique, ainsi qu'aux obligations administratives, comptables et fiscales ;</li>
<li>enregistrement des accès à l'établissement ;</li>
<li>collecte, enregistrement et consultation des données personnelles de la personne concernée aux fins de protection des personnes, des biens et du patrimoine de l'entreprise au moyen d'un <u>éventuel</u> système de vidéosurveillance (si et là où il est présent) ;</li>
<li>envoi de communications commerciales et de documentation sur des offres et tarifs relatifs à des services dont vous avez déjà bénéficié (soft spam) ;</li>
<li>envoi de communications commerciales et de documentation sur des offres et tarifs relatifs à de nouveaux services ou à des promotions de tiers (marketing direct) ;</li>
<li>amélioration et personnalisation du service en fonction des préférences et habitudes de séjour, qui peuvent concerner des catégories particulières de données personnelles (au sens de l'art. 9 RGPD, dites « données sensibles », telles que <em>des demandes liées à un handicap, des allergies alimentaires, etc.</em>). Nous vous informons que ces données seront traitées par du personnel autorisé avec la plus grande confidentialité et ne seront pas communiquées à des tiers non autorisés.</li>
</ol>
<h2>Base juridique du traitement</h2>
<p>Les données collectées pour les finalités indiquées ci-dessus sont traitées de manière licite, car elles sont nécessaires :</p>
<ul>
<li>à l'exécution d'un contrat auquel la personne concernée est partie ou à l'exécution de mesures précontractuelles prises à sa demande (finalités visées aux points 1 et 2) ;</li>
<li>au respect d'une obligation légale à laquelle le responsable du traitement est soumis (finalité visée au point 3) ;</li>
<li>à la poursuite d'un intérêt légitime du responsable du traitement : protection de la sécurité des personnes et du patrimoine de l'entreprise (finalités 4 et 5). Soft spam art. 6, par. 1, point f) RGPD, afin de vous offrir un meilleur service, cohérent avec vos achats. Dans ce cas, le consentement préalable n'est pas requis, mais vous pourrez vous opposer à ces communications à tout moment (en cliquant sur « se désinscrire » en bas des e-mails ou en nous écrivant), gratuitement et avec effet immédiat (finalité 6) ;</li>
<li>aux finalités visées aux points 7 et 8, avec le consentement explicite de la personne concernée exprimé par signature.</li>
</ul>
<h2>Destinataires des données</h2>
<p>Les données personnelles traitées par l'${ORG} ne sont pas diffusées, c'est-à-dire qu'elles ne sont mises à la disposition de personnes indéterminées sous aucune forme, y compris par leur mise à disposition ou leur consultation. Elles peuvent toutefois être communiquées aux salariés, bénévoles ou collaborateurs du responsable du traitement, ainsi qu'à des entités externes qui collaborent avec le responsable du traitement, désignées comme sous-traitants ou autorisées au traitement car elles agissent sous l'autorité du responsable du traitement.</p>
<p>En particulier, en fonction des rôles et des tâches exercés, les travailleurs ont été autorisés à traiter vos données personnelles dans les limites de leurs compétences respectives et conformément aux instructions données par le responsable du traitement.</p>
<p>Elles peuvent en outre être communiquées, dans la mesure strictement nécessaire, à des entités qui, pour donner suite à vos demandes, doivent fournir des biens ou exécuter des prestations pour le compte du responsable du traitement. Enfin, elles peuvent être communiquées à des entités habilitées à y accéder en vertu de lois, de règlements ou de la réglementation de l'Union européenne.</p>
<p>Les entités externes qui agissent sous l'autorité du responsable du traitement ont également été dûment autorisées en fonction du type de service fourni, du traitement effectué et de la nature des données traitées.</p>
<p>Les entités externes auxquelles le responsable du traitement a confié le traitement des données personnelles ont été désignées comme sous-traitants.</p>
<h2>Transfert des données</h2>
<p>Si le responsable du traitement transfère des données personnelles vers des pays tiers ou des organisations internationales, dans le cadre des finalités indiquées ci-dessus, vous serez informé(e) de l'existence ou non d'une décision d'adéquation de la Commission européenne.</p>
<p>Le responsable du traitement se réserve en outre la possibilité d'utiliser des services cloud ; dans ce cas, les fournisseurs seront choisis parmi ceux qui offrent des garanties appropriées, conformément à l'art. 46 du RGPD 2016/679.</p>
<h2>Conservation des données</h2>

<p>Le responsable du traitement rappelle en particulier que toute personne concernée peut exercer le droit d'opposition selon les modalités et formes prévues par l'art. 21 RGPD.</p>

html:`
<p>La presente información se facilita, de conformidad con el art. 13 del RGPD 679/2016 – «Reglamento europeo de protección de datos personales», a las personas que reservan una habitación en Abaton, celebrando una transacción con Ass. La Grande Opera impresa sociale, o con una de las entidades que han designado a Ass. La Grande Opera impresa sociale como encargada del tratamiento (art. 28 RGPD).</p>
<h2>Identidad del responsable del tratamiento</h2>
<p>El responsable del tratamiento es la ${ORG}, con domicilio social en Via Baldissero, 21, Vidracco (TO), representada por su Presidente en ejercicio.</p>
<p>La ${ORG} ha sido designada además encargada del tratamiento, de conformidad con el art. 28 RGPD, por los responsables autónomos o corresponsables del tratamiento enumerados en <a href="http://www.damanhur.org/it/privacy" target="_blank" rel="noopener">www.damanhur.org/it/privacy</a>. El tratamiento para el que la ${ORG} ha sido designada encargada es la gestión de los datos de contacto de las personas para garantizar el disfrute seguro de sus actividades.</p>
<p>La respuesta a los interesados que ejercen sus derechos corresponde al responsable o a los corresponsables del tratamiento de los datos personales.</p>
<p>La ${ORG} garantiza la seguridad, la confidencialidad y la protección de los datos personales que obran en su poder, en cada fase del tratamiento.</p>
<h2>Identidad del Delegado de Protección de Datos</h2>
<p>Se ha designado un Delegado de Protección de Datos (DPD), con domicilio a efectos de esta función en la sede social de la ${ORG} en Via Baldissero, 21, Vidracco (TO), al que se puede contactar por correo electrónico en <a href="mailto:direttivo@grandeopera.org">direttivo@grandeopera.org</a></p>
<h2>Origen de los datos</h2>
<p>Los datos personales tratados son los facilitados por el interesado con ocasión de:</p>
<ul><li>estancias o llamadas telefónicas;</li><li>contactos directos;</li><li>sitios web, redes sociales, correo electrónico;</li><li>elaboración de propuestas y presupuestos;</li><li>transmisiones y transacciones derivadas de un pedido;</li><li>reseñas publicadas voluntariamente, en papel o en línea.</li></ul>
<h2>Finalidades del tratamiento</h2>
<p>Los datos personales se tratan para la realización de las actividades precontractuales necesarias, para la definición y aceptación del contrato de servicio que regula la prestación y para el correcto desarrollo de todas las actividades relacionadas.</p>
<p>En particular, se tratan para las siguientes finalidades:</p>
<ol>
<li>recibir, confirmar, cancelar y gestionar las reservas de los servicios de alojamiento y de los servicios complementarios, y prestar los servicios solicitados;</li>
<li>realización de las actividades relacionadas e instrumentales a la gestión de la relación contractual (prestación de los servicios, rendición de cuentas de la prestación);</li>
<li>comunicación de los datos personales relativos a la estancia para cumplir las obligaciones legales en materia de seguridad pública, así como las obligaciones administrativas, contables y fiscales;</li>
<li>registro de los accesos al establecimiento;</li>
<li>obtención, registro y consulta de los datos personales del interesado con fines de protección de las personas, los bienes y el patrimonio de la empresa mediante un <u>eventual</u> sistema de videovigilancia (si existe y donde exista);</li>
<li>envío de comunicaciones comerciales y material informativo sobre ofertas y tarifas relativas a servicios que ya ha disfrutado (soft spam);</li>
<li>envío de comunicaciones comerciales y material informativo sobre ofertas y tarifas relativas a nuevos servicios o promociones de terceros (marketing directo);</li>
<li>mejora y personalización del servicio en relación con las preferencias y hábitos de estancia, que pueden afectar a categorías especiales de datos personales (en el sentido del art. 9 RGPD, los llamados «datos sensibles», como por ejemplo <em>solicitudes relacionadas con discapacidades, alergias alimentarias, etc.</em>). Le informamos de que dichos datos serán tratados por personal autorizado con la máxima confidencialidad y no se comunicarán a terceros no autorizados.</li>
</ol>
<h2>Base jurídica del tratamiento</h2>
<p>Los datos recogidos para las finalidades indicadas se tratan lícitamente por ser necesarios para:</p>
<ul>
<li>la ejecución de un contrato en el que el interesado es parte o la aplicación de medidas precontractuales adoptadas a petición de este (finalidades de los puntos 1 y 2);</li>
<li>el cumplimiento de una obligación legal aplicable al responsable (finalidad del punto 3);</li>
<li>la satisfacción de un interés legítimo del responsable: protección de la seguridad de las personas y del patrimonio de la empresa (finalidades 4 y 5). Soft spam art. 6, apdo. 1, letra f) RGPD, para poder ofrecerle un servicio mejor y coherente con sus compras. En este caso no se requiere el consentimiento previo, pero podrá oponerse a dichas comunicaciones en cualquier momento (haciendo clic en «darse de baja» al final de los correos electrónicos o escribiéndonos), de forma gratuita y con efecto inmediato (finalidad 6);</li>
<li>las finalidades de los puntos 7 y 8, con el consentimiento explícito del interesado expresado mediante firma.</li>
</ul>
<h2>Destinatarios de los datos</h2>
<p>Los datos personales tratados por la ${ORG} no se difunden, es decir, no se ponen a disposición de sujetos indeterminados en ninguna forma, ni siquiera mediante su puesta a disposición o consulta. No obstante, pueden comunicarse a trabajadores, voluntarios o colaboradores del responsable, así como a entidades externas que colaboran con el responsable, designadas encargadas del tratamiento o autorizadas al tratamiento por actuar bajo la autoridad del responsable.</p>
<p>En particular, en función de las funciones y tareas desempeñadas, los trabajadores han sido autorizados a tratar sus datos personales dentro de los límites de sus respectivas competencias y de conformidad con las instrucciones impartidas por el responsable.</p>
<p>Además, pueden comunicarse, en la medida estrictamente necesaria, a entidades que, para dar curso a sus solicitudes, deban suministrar bienes o realizar prestaciones por cuenta del responsable. Por último, pueden comunicarse a entidades legitimadas para acceder a ellos en virtud de leyes, reglamentos o normativa de la Unión Europea.</p>
<p>También las entidades externas que actúan bajo la autoridad del responsable han sido debidamente autorizadas en función del tipo de servicio prestado, del tratamiento realizado y de la naturaleza de los datos tratados.</p>
<p>Las entidades externas a las que el responsable ha confiado el tratamiento de los datos personales han sido designadas encargadas del tratamiento.</p>
<h2>Transferencia de los datos</h2>
<p>Si el responsable transfiere datos personales a terceros países u organizaciones internacionales, en el marco de las finalidades indicadas, se le informará sobre la existencia o no de una decisión de adecuación de la Comisión Europea.</p>
<p>El responsable se reserva además la posibilidad de utilizar servicios en la nube; en tal caso, los proveedores de los servicios se seleccionarán entre aquellos que ofrezcan garantías adecuadas, según lo previsto en el art. 46 del RGPD 2016/679.</p>
<h2>Conservación de los datos</h2>
<p>El responsable conserva y trata los datos personales durante el tiempo necesario para cumplir las finalidades indicadas. En particular, los datos de los clientes se conservan hasta el término del plazo de prescripción administrativa aplicable.</p>
<h2>Derechos del interesado</h2>
<p>En relación con los arts. 15 – derecho de acceso, 16 – derecho de rectificación, 17 – derecho de supresión, 18 – derecho a la limitación del tratamiento, 20 – derecho a la portabilidad de los datos, 21 – derecho de oposición, 22 – derecho de oposición a decisiones automatizadas del RGPD, el interesado puede ejercer sus derechos escribiendo a <a href="mailto:direttivo@grandeopera.org">direttivo@grandeopera.org</a> o al responsable en la dirección indicada, especificando el objeto de la solicitud y el derecho que desea ejercer, y adjuntando copia de un documento de identidad que acredite la legitimidad de la solicitud.</p>
<p>El responsable recuerda en particular que todo interesado puede ejercer el derecho de oposición en los modos y formas previstos por el art. 21 RGPD.</p>
<h2>Revocación del consentimiento</h2>
<p>De conformidad con el art. 7 del RGPD, el interesado puede revocar en cualquier momento el consentimiento prestado. No obstante, los tratamientos que no requieren consentimiento para ser lícitos podrán realizarse incluso sin él, por ejemplo para la ejecución de un contrato en el que el interesado es parte (relación de suministro de productos y/o servicios) y sobre las demás bases jurídicas indicadas.</p>
<h2>Negativa a facilitar los datos</h2>
<p>El interesado no puede negarse a facilitar al responsable los datos personales necesarios para las obligaciones civiles, contables y fiscales relacionadas con el suministro o la prestación de los servicios.</p>
<p>La comunicación de otros datos personales, aunque es facultativa, es necesaria para una gestión correcta y eficiente de la relación contractual. Por lo tanto, la eventual negativa a facilitar dichos datos podrá comprometer total o parcialmente la propia relación contractual.</p>
<h2>Procesos de decisión automatizados</h2>
<p>Si fuera necesario un tratamiento que implique procesos de decisión automatizados sobre datos de personas físicas, se solicitará el consentimiento explícito y debidamente especificado del interesado.</p>
`},

html:`
<p>Настоящее уведомление предоставляется в соответствии со ст. 13 GDPR 679/2016 — «Европейского регламента о защите персональных данных» — лицам, которые бронируют номер в Abaton, заключая сделку с Ass. La Grande Opera impresa sociale или с одним из субъектов, назначивших Ass. La Grande Opera impresa sociale обработчиком данных (ст. 28 GDPR).</p>
<h2>Сведения о контролёре данных</h2>
<p>Контролёром данных является ${ORG}, юридический адрес: Via Baldissero, 21, Vidracco (TO), в лице действующего Президента.</p>
<p>${ORG} также назначена обработчиком данных в соответствии со ст. 28 GDPR самостоятельными или совместными контролёрами, перечисленными по адресу <a href="http://www.damanhur.org/it/privacy" target="_blank" rel="noopener">www.damanhur.org/it/privacy</a>. Обработка, для которой ${ORG} назначена обработчиком, — это управление контактными данными лиц для обеспечения безопасного участия в их мероприятиях.</p>
<p>Ответ субъектам данных, осуществляющим свои права, предоставляется контролёром или совместными контролёрами персональных данных.</p>
<p>${ORG} обеспечивает безопасность, конфиденциальность и защиту имеющихся у неё персональных данных на каждом этапе обработки.</p>
<h2>Сведения об инспекторе по защите данных</h2>
<p>Назначен инспектор по защите данных (DPO); адрес для исполнения этой функции — юридический адрес ${ORG}: Via Baldissero, 21, Vidracco (TO); связаться с ним можно по электронной почте <a href="mailto:direttivo@grandeopera.org">direttivo@grandeopera.org</a></p>
<h2>Источник данных</h2>
<p>Обрабатываются персональные данные, предоставленные субъектом данных в связи с:</p>
<ul><li>проживанием или телефонными звонками;</li><li>прямыми контактами;</li><li>веб-сайтами, социальными сетями, электронной почтой;</li><li>подготовкой предложений и смет;</li><li>передачей данных и сделками после оформления заказа;</li><li>добровольно оставленными отзывами, в бумажном виде или онлайн.</li></ul>
<h2>Цели обработки</h2>
<p>Персональные данные обрабатываются для осуществления необходимых преддоговорных действий, для определения и принятия договора на оказание услуг, регулирующего их предоставление, а также для надлежащего выполнения всех связанных с этим действий.</p>
<p>В частности, они обрабатываются в следующих целях:</p>
<ol>
<li>получение, подтверждение, отмена и управление бронированиями услуг размещения и дополнительных услуг, а также предоставление запрошенных услуг;</li>
<li>осуществление действий, связанных с управлением договорными отношениями и необходимых для него (оказание услуг, отчётность об оказанных услугах);</li>
<li>передача персональных данных, связанных с проживанием, для выполнения установленных законом обязанностей в сфере общественной безопасности, а также административных, бухгалтерских и налоговых обязанностей;</li>
<li>регистрация входа на территорию объекта;</li>
<li>получение, запись и просмотр персональных данных субъекта в целях защиты людей, имущества и активов организации с помощью <u>возможной</u> системы видеонаблюдения (если и где она имеется);</li>
<li>направление коммерческих сообщений и информационных материалов о предложениях и тарифах на услуги, которыми вы уже воспользовались (soft spam);</li>
<li>направление коммерческих сообщений и информационных материалов о предложениях и тарифах на новые услуги или о рекламных акциях третьих лиц (прямой маркетинг);</li>
<li>улучшение и персонализация обслуживания с учётом предпочтений и привычек во время проживания, которые могут касаться особых категорий персональных данных (в соответствии со ст. 9 GDPR, так называемые «чувствительные данные», например <em>запросы, связанные с инвалидностью, пищевой аллергией и т. п.</em>). Сообщаем вам, что такие данные будут обрабатываться уполномоченным персоналом с соблюдением строжайшей конфиденциальности и не будут передаваться неуполномоченным третьим лицам.</li>
</ol>
<h2>Правовое основание обработки</h2>
<p>Данные, собранные для указанных выше целей, обрабатываются правомерно, поскольку это необходимо для:</p>
<ul>
<li>исполнения договора, стороной которого является субъект данных, или принятия преддоговорных мер по его запросу (цели, указанные в пунктах 1 и 2);</li>
<li>выполнения юридической обязанности, возложенной на контролёра (цель, указанная в пункте 3);</li>
<li>реализации законного интереса контролёра: обеспечения безопасности людей и активов организации (цели 4 и 5). Soft spam — ст. 6, п. 1, пп. f) GDPR, чтобы мы могли предложить вам лучшее обслуживание, соответствующее вашим покупкам. В этом случае предварительное согласие не требуется, но вы можете в любой момент бесплатно и с немедленным эффектом возразить против таких сообщений (нажав «отписаться» в конце письма или написав нам) (цель 6);</li>
<li>целей, указанных в пунктах 7 и 8, — с явного согласия субъекта данных, выраженного подписью.</li>
</ul>
<h2>Получатели данных</h2>
<p>Персональные данные, обрабатываемые ${ORG}, не распространяются, то есть ни в какой форме не предоставляются неопределённому кругу лиц, в том числе путём предоставления к ним доступа или возможности ознакомления. Однако они могут передаваться работникам, волонтёрам или сотрудникам контролёра, а также внешним субъектам, сотрудничающим с контролёром, назначенным обработчиками или уполномоченным на обработку, поскольку они действуют под руководством контролёра.</p>
<p>В частности, в зависимости от выполняемых ролей и обязанностей работники уполномочены обрабатывать ваши персональные данные в пределах своей компетенции и в соответствии с инструкциями контролёра.</p>
<p>Кроме того, в строго необходимой мере данные могут передаваться субъектам, которые для выполнения ваших запросов должны поставлять товары или оказывать услуги от имени контролёра. Наконец, они могут передаваться субъектам, имеющим право доступа к ним в силу законов, нормативных актов или законодательства Европейского союза.</p>
<p>Внешние субъекты, действующие под руководством контролёра, также надлежащим образом уполномочены в зависимости от вида оказываемых услуг, осуществляемой обработки и характера обрабатываемых данных.</p>
<p>Внешние субъекты, которым контролёр поручил обработку персональных данных, назначены обработчиками данных.</p>
<h2>Передача данных</h2>
<p>Если контролёр будет передавать персональные данные в третьи страны или международные организации в рамках указанных выше целей, вы будете проинформированы о наличии или отсутствии решения Европейской комиссии о достаточности уровня защиты.</p>
<p>Контролёр также оставляет за собой возможность использовать облачные сервисы; в этом случае поставщики услуг будут выбираться из числа тех, кто предоставляет надлежащие гарантии, как предусмотрено ст. 46 GDPR 2016/679.</p>
<h2>Хранение данных</h2>
<p>Контролёр хранит и обрабатывает персональные данные в течение срока, необходимого для достижения указанных целей. В частности, данные клиентов хранятся до истечения применимого срока административной давности.</p>
<h2>Права субъекта данных</h2>
<p>В соответствии со ст. 15 — право на доступ, 16 — право на исправление, 17 — право на удаление, 18 — право на ограничение обработки, 20 — право на переносимость данных, 21 — право на возражение, 22 — право на возражение против автоматизированного принятия решений GDPR субъект данных может осуществить свои права, написав по адресу <a href="mailto:direttivo@grandeopera.org">direttivo@grandeopera.org</a> или контролёру по указанному выше адресу, указав предмет запроса и право, которое он намерен осуществить, и приложив копию документа, удостоверяющего личность, который подтверждает правомерность запроса.</p>
<p>Контролёр особо напоминает, что каждый субъект данных может осуществить право на возражение в порядке и формах, предусмотренных ст. 21 GDPR.</p>
<h2>Отзыв согласия</h2>
<p>В соответствии со ст. 7 GDPR субъект данных может в любой момент отозвать данное согласие. Однако обработка, для правомерности которой согласие не требуется, может осуществляться и без согласия, например для исполнения договора, стороной которого является субъект данных (отношения по поставке товаров и/или услуг), а также на других указанных выше правовых основаниях.</p>
<h2>Отказ от предоставления данных</h2>

<p>Предоставление дополнительных персональных данных, хотя и является добровольным, необходимо для правильного и эффективного управления договорными отношениями. Поэтому возможный отказ от предоставления таких данных может полностью или частично поставить под угрозу сами договорные отношения.</p>

/* ===================== FUNZIONAMENTO (non toccare) ===================== */
const $ = id => document.getElementById(id);
let lang = "it";

function pickLang(){
  const q = new URLSearchParams(location.search).get("lang");
  if (q && DOC[q]) return q;
  const n = (navigator.language || "it").slice(0,2).toLowerCase();
  return DOC[n] ? n : "it";
}

function render(l){
  lang = l;
  const d = DOC[l], u = UI[l];
  document.documentElement.lang = l;
  $("title").textContent = d.title;
  $("info").innerHTML = d.html;
  $("info").scrollTop = 0;
  $("tDati").textContent = u.dati;
  $("lNome").textContent = u.nome + " *";
  $("lCognome").textContent = u.cognome + " *";
  $("lEmail").textContent = u.email + " *";
  $("lTel").textContent = u.tel + " " + u.opt;
  $("tDichiaro").textContent = d.dichiaro;
  $("tModulo").textContent = d.modulo;
  $("t7").textContent = d.p7;
  $("t8").textContent = d.p8;
  document.querySelectorAll(".tPresta").forEach(e => e.textContent = d.presta);
  document.querySelectorAll(".tNega").forEach(e => e.textContent = d.nega);
  $("send").textContent = u.send;
  document.querySelectorAll("#langs button").forEach(b => b.setAttribute("aria-pressed", b.dataset.l === l));
  ["errInfo","err7","err8"].forEach(id => $(id).style.display = "none");
  $("msg").style.display = "none";
}

LANGS.forEach(([code,name]) => {
  const b = document.createElement("button");
  b.type = "button"; b.dataset.l = code; b.textContent = name;
  b.onclick = () => render(code);
  $("langs").appendChild(b);
});

function radio(name){ const r = document.querySelector(`input[name=${name}]:checked`); return r ? r.value : ""; }
function showErr(id, text, show){ const e = $(id); e.textContent = text; e.style.display = show ? "block" : "none"; }

$("form").addEventListener("submit", async ev => {
  ev.preventDefault();
  const u = UI[lang];
  const nome = $("nome").value.trim(), cognome = $("cognome").value.trim(), email = $("email").value.trim();
  const p7 = radio("p7"), p8 = radio("p8"), info = $("informativa").checked;
  const emailOk = /^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email);

  showErr("errInfo", u.must, !info);
  showErr("err7", u.choose, !p7);
  showErr("err8", u.choose, !p8);
  const msg = $("msg");
  if (!nome || !cognome || !emailOk){ msg.className = "msg ko"; msg.textContent = u.fill; msg.style.display = "block"; return; }
  if (!info || !p7 || !p8){ msg.style.display = "none"; return; }

  const btn = $("send");
  btn.disabled = true; btn.textContent = u.sending; msg.style.display = "none";
  try{
    const res = await fetch(SCRIPT_URL, {
      method:"POST",
      body: JSON.stringify({
        lingua: lang, nome, cognome, email, telefono: $("telefono").value.trim(),
        informativa: true, p7, p8, versione: VERSIONE, website: $("website").value
      })
    });
    const out = await res.json();
    if (!out.ok) throw new Error(out.error || "errore");
    $("form").querySelectorAll("input,button").forEach(e => e.disabled = true);
    msg.className = "msg ok"; msg.textContent = u.ok;
  }catch(e){
    btn.disabled = false;
    msg.className = "msg ko"; msg.textContent = u.ko;
  }
  msg.style.display = "block";
  btn.textContent = u.send;
});

render(pickLang());
</script>
